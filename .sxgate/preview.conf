# sxgate preview manifest for DevLab — UI-only static SPA (no backend yet).
# Sourced by `sxgate preview`; the engine expands {worktree} {state} {zone} {port}.
#
# Phase 1 is a pure front-end design: build the Vite SPA into dist/ and serve it statically
# with SPA fallback. When the backend lands, switch MODE to "static_proxy" and add
# RUN/API_PREFIX/HEALTHCHECK (mirroring ../holistic/.sxgate/preview.conf).

SERVICE="devlab"

# Self-contained build: DevLab vendors its design tokens, so no sibling repo is needed.
BUILD="cd {worktree} && CI=true npm install --no-audit --no-fund --silent && npm run build"

# Pure static SPA: serve dist/ with try_files {path} /index.html.
MODE="static"
ROOT="dist"
