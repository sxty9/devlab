# sxgate preview manifest for DevLab — how to build & run a branch sandbox.
# Sourced by `sxgate preview`; placeholders {worktree} {state} {zone} {port} are expanded by the
# engine (runtime values use {port}, NOT $PORT). Values that must defer to run time are single-
# quoted so they are not expanded while sourcing.
#
# Sandbox safety lives in RUN_ENV: the backend runs in dev-bypass (no Holistic SSO, no real
# GitHub OAuth, no real secret) and the "workspace" is a throwaway checkout of devlab itself, so
# a preview never touches real sessions, real GitHub links, or the operator's working copies.

SERVICE="devlab"

# Self-contained build: the Vite SPA (devlab vendors its design tokens) + the Go backend binary.
BUILD="cd {worktree} && CI=true npm install --no-audit --no-fund --silent && npm run build \
&& cd {worktree}/backend && go build -o {worktree}/devlabd ./cmd/devlabd"

# Static SPA + /api reverse-proxied to the Go backend.
MODE="static_proxy"
ROOT="dist"
API_PREFIX="/api"

RUN="{worktree}/devlabd --listen 127.0.0.1:{port}"
RUN_CWD="{worktree}"
# Sandboxed: dev-bypass grants full access without a Holistic session or GitHub link. Discovery
# and writes target a throwaway checkout of devlab itself (symlinked in SEED), so every edit,
# stage, commit and branch is discarded when the preview is torn down.
RUN_ENV="
DEVLAB_DEV_BYPASS_AUTH=1
DEVLAB_REPOS_PATH={state}/repos
DEVLAB_REPOS_ALLOWLIST=devlab
DEVLAB_WORKSPACES={state}/workspaces
"

# Seed the throwaway repo set: expose only this branch's own checkout as the repo "devlab".
SEED='mkdir -p {state}/repos {state}/workspaces
ln -sfn {worktree} {state}/repos/devlab
echo "Sandboxed DevLab preview (dev-bypass auth). You are editing a throwaway checkout of devlab; changes are discarded when the preview ends."'

HEALTHCHECK="/api/health"
